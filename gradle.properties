org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# No AndroidX / support-library dependencies are used anywhere in this project.
# minSdk 9 (Gingerbread) relies only on plain framework APIs (InputMethodService,
# android.inputmethodservice.Keyboard/KeyboardView, View, Drawable) that have been
# present since API 3. Adding an AndroidX dependency risks transitively raising the
# effective minSdk floor above 9, so keep this false and avoid such dependencies.
android.useAndroidX=false
