plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nachoz12341.playkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.nachoz12341.playkeyboard"
        minSdk 9
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // android.inputmethodservice.Keyboard/KeyboardView are deprecated in later API
        // levels but are the deliberate rendering choice for this project (see plan doc);
        // don't fail the build over that expected warning.
        disable 'Deprecated'
    }
}
